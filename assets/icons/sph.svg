<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2640"/>
      <stop offset="100%" stop-color="#0F1422"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55689E"/>
      <stop offset="50%" stop-color="#3D4B75"/>
      <stop offset="100%" stop-color="#262F4C"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGrad)" stroke="#2B3654" stroke-width="2.5"/>

  <!-- Subtle Circuit / Vector Grid Accent -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1.2">
    <line x1="32" y1="64" x2="224" y2="64"/>
    <line x1="32" y1="128" x2="224" y2="128"/>
    <line x1="32" y1="192" x2="224" y2="192"/>
    <line x1="64" y1="32" x2="64" y2="224"/>
    <line x1="128" y1="32" x2="128" y2="224"/>
    <line x1="192" y1="32" x2="192" y2="224"/>
  </g>

  <!-- Central Shield / Emblem -->
  <path d="M 128 36 L 196 68 L 196 142 C 196 182 128 216 128 216 C 128 216 60 182 60 142 L 60 68 Z" fill="url(#shieldGrad)" stroke="#7486BA" stroke-width="2.5" filter="url(#subtleShadow)"/>

  <!-- Sentient Cyber Spark / Wing -->
  <path d="M 96 102 L 72 74 L 90 74 L 110 100 Z" fill="url(#neonGrad)" filter="url(#neonGlow)"/>
  <path d="M 104 126 L 82 98 L 98 98 L 116 120 Z" fill="#00E5FF" opacity="0.85"/>

  <!-- Stylized Elephant Head Silhouette (PHP Heritage) -->
  <path d="M 108 86 C 132 86 160 94 160 122 C 160 134 152 142 144 146 C 152 154 160 166 152 170 C 144 174 132 162 128 150 C 120 150 112 142 112 130 C 112 118 104 110 100 110 Z" fill="#FFFFFF" opacity="0.96"/>
  <!-- Sentient Cybernetic Eye -->
  <circle cx="140" cy="110" r="7" fill="url(#neonGrad)" filter="url(#neonGlow)"/>
  <circle cx="140" cy="110" r="3" fill="#FFFFFF"/>

  <!-- SPH Neon Banner Plate -->
  <rect x="68" y="166" width="120" height="38" rx="10" fill="#0E1322" stroke="url(#accentGrad)" stroke-width="2" filter="url(#subtleShadow)"/>
  <text x="128" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">SPH</text>
</svg>

