name: SantientPHP Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Release (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for VS Code Extension
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Package VS Code Extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx @vscode/vsce package --no-git-tag-version --allow-missing-repository

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake

      - name: Add UCRT64 to PATH
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build Compiler & Runtime
        run: |
          ninja -C build

      - name: Package Windows Distribution
        shell: powershell
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          .\tools\package_release.ps1 -Version $Version

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.vsix

  build-linux:
    name: Package Release (Ubuntu Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build libsqlite3-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Compiler & Runtime
        run: |
          ninja -C build

      - name: Assemble Linux Distribution Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_NAME="santientphp-v${VERSION}-linux-x64"
          mkdir -p "dist/${DIST_NAME}/bin" "dist/${DIST_NAME}/lib" "dist/${DIST_NAME}/runtime" "dist/${DIST_NAME}/stdlib" "dist/${DIST_NAME}/examples" "dist/${DIST_NAME}/docs"
          cp build/bin/sphc "dist/${DIST_NAME}/bin/sphc"
          cp build/bin/sphc "dist/${DIST_NAME}/bin/sph"
          cp build/bin/sphc "dist/${DIST_NAME}/bin/santientphp"
          cp build/lib/*.a "dist/${DIST_NAME}/lib/"
          cp -r runtime/* "dist/${DIST_NAME}/runtime/"
          cp -r stdlib/* "dist/${DIST_NAME}/stdlib/"
          cp -r examples/* "dist/${DIST_NAME}/examples/"
          cp -r docs/* "dist/${DIST_NAME}/docs/"
          cp sph.ini sph.ini-development sph.ini-production sph.toml LICENSE README.md "dist/${DIST_NAME}/"
          tar -czvf "dist/${DIST_NAME}.tar.gz" -C dist "${DIST_NAME}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated Checksums
        working-directory: release-assets
        run: |
          sha256sum santientphp-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SantientPHP ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*

