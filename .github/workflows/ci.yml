name: SantientPHP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    name: Build & Test (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake

      - name: Add UCRT64 to PATH
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build Compiler, Runtime & Tests
        run: |
          ninja -C build

      - name: Execute Full Test Suite
        shell: powershell
        run: |
          .\build\bin\sph_tests.exe 2>&1 | Tee-Object -FilePath test_log.txt
          $failures = Get-Content test_log.txt | Select-String -Pattern "FAILED|CHECK"
          foreach ($f in $failures) {
              Write-Output "::error::$f"
          }
          if ((Get-Content test_log.txt | Select-String "0 failed").Count -eq 0) {
              exit 1
          }

      - name: Verify CLI Compiler Run
        run: |
          .\build\bin\sphc.exe doctor
          .\build\bin\sphc.exe run hello.sph

  build-and-test-linux:
    name: Build & Test (Ubuntu Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build libsqlite3-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Compiler, Runtime & Tests
        run: |
          ninja -C build

      - name: Execute Full Test Suite
        run: |
          ./build/bin/sph_tests 2>&1 | tee test_log.txt || true
          grep -E "FAILED|CHECK" test_log.txt | head -n 30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -q "0 failed" test_log.txt

      - name: Verify CLI Compiler Run
        run: |
          ./build/bin/sphc doctor
          ./build/bin/sphc run hello.sph
