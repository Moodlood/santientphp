name: SantientPHP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    name: Build & Test (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake

      - name: Add UCRT64 to PATH
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build Compiler, Runtime & Tests
        run: |
          ninja -C build

      - name: Execute Full Test Suite
        shell: powershell
        run: |
          $testExit = 0
          try {
              .\build\bin\sph_tests.exe 2>&1 | Tee-Object -FilePath test_log.txt
          } catch {
              Write-Host "Error running tests: $_"
              $testExit = 1
          }
          if ($LASTEXITCODE -ne 0) { $testExit = $LASTEXITCODE }

          "### Windows Test Suite Results" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Exit code: $testExit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-Content test_log.txt | Select-String -Pattern "FAILED|assertion failure|Test Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($testExit -ne 0) { exit $testExit }

      - name: Verify CLI Compiler Run
        run: |
          .\build\bin\sphc.exe doctor
          .\build\bin\sphc.exe run hello.sph

  build-and-test-linux:
    name: Build & Test (Ubuntu Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build libsqlite3-dev binutils

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Compiler, Runtime & Tests
        run: |
          ninja -C build

      - name: Execute Full Test Suite
        run: |
          set +e
          ./build/bin/sph_tests 2>&1 | tee test_log.txt
          test_res=${PIPESTATUS[0]}
          echo "### Linux Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: $test_res" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "FAILED|assertion failure|Test Summary" test_log.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $test_res

      - name: Verify CLI Compiler Run
        run: |
          ./build/bin/sphc doctor
          ./build/bin/sphc run hello.sph
