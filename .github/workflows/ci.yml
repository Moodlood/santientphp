name: SantientPHP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    name: Build & Test (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build Compiler, Runtime & Tests
        run: |
          ninja -C build

      - name: Execute Full Test Suite
        run: |
          .\build\bin\sph_tests.exe

      - name: Verify CLI Compiler Run
        run: |
          .\build\bin\sphc.exe doctor
          .\build\bin\sphc.exe run hello.sph

  build-and-test-linux:
    name: Build & Test (Ubuntu Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build libsqlite3-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Compiler, Runtime & Tests
        run: |
          ninja -C build

      - name: Execute Full Test Suite
        run: |
          ./build/bin/sph_tests

      - name: Verify CLI Compiler Run
        run: |
          ./build/bin/sphc doctor
          ./build/bin/sphc run hello.sph
